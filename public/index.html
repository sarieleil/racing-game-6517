<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🏎️ Jungle Kart Racing - Professional 3D</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <!-- Lobby Screen -->
    <div id="lobby-screen" class="screen active">
        <div class="lobby-container">
            <h1 class="game-title">🏎️ JUNGLE KART RACING</h1>
            <p class="subtitle">Professional Mario Kart Style Racing!</p>
            
            <div class="form-group">
                <input type="text" id="player-name" placeholder="Enter your name" maxlength="15">
            </div>
            
            <button id="create-room-btn" class="btn btn-create">🌴 Create Race</button>
            
            <div class="divider">OR</div>
            
            <div class="form-group">
                <input type="text" id="room-code-input" placeholder="Room Code" maxlength="6">
            </div>
            
            <button id="join-room-btn" class="btn btn-join">🏁 Join Race</button>
            
            <div id="error-message" class="error-message"></div>
        </div>
    </div>

    <!-- Waiting Room -->
    <div id="waiting-screen" class="screen">
        <div class="lobby-container">
            <h2 class="game-title">🏁 Race Lobby</h2>
            <div class="room-code-box">
                <span>Room Code:</span>
                <div class="room-code" id="room-code-display"></div>
            </div>
            
            <div id="players-list" class="players-list"></div>
            
            <button id="start-race-btn" class="btn btn-start">🏁 START RACE!</button>
            <button id="leave-room-btn" class="btn btn-leave">← Leave</button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <!-- HUD -->
        <div class="hud">
            <div class="hud-left">
                <div class="hud-item lap">LAP <span id="lap-display">1/3</span></div>
                <div class="hud-item position">POS <span id="position-display">1st</span></div>
            </div>
            <div class="hud-right">
                <div class="hud-item speed">
                    <span id="speed-display">0</span>
                    <small>km/h</small>
                </div>
            </div>
        </div>
        
        <!-- Countdown -->
        <div id="countdown" class="countdown"></div>
        
        <!-- Game Container -->
        <div id="game-container"></div>
        
        <!-- Mobile Controls -->
        <div id="mobile-controls" class="mobile-controls">
            <!-- Gas/Brake -->
            <div class="pedals">
                <button id="btn-gas" class="pedal-btn gas-btn">
                    <span>⬆️</span>
                    <small>GAS</small>
                </button>
                <button id="btn-brake" class="pedal-btn brake-btn">
                    <span>⬇️</span>
                    <small>BRAKE</small>
                </button>
            </div>
            
            <!-- Steering -->
            <div class="steering">
                <button id="btn-left" class="steer-btn">⬅️</button>
                <button id="btn-right" class="steer-btn">➡️</button>
            </div>
            
            <!-- Item button -->
            <div class="item-btn-container">
                <button id="btn-drift" class="item-btn">
                    <span>🎁</span>
                    <small>ITEM</small>
                </button>
            </div>
        </div>
    </div>

    <!-- Results -->
    <div id="results-screen" class="screen">
        <div class="lobby-container">
            <h2 class="game-title">🏆 RACE RESULTS</h2>
            <div id="results-list"></div>
            <button id="play-again-btn" class="btn btn-create">🔄 Race Again</button>
            <button id="back-to-lobby-btn" class="btn btn-leave">🏠 Lobby</button>
        </div>
    </div>

    <div id="message-container" class="message-container"></div>

    <script src="/js/game.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
